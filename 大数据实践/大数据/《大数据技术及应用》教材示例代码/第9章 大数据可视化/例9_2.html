<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ECharts饼图实例</title>
    <!-- 引入 echarts.js -->
    <script src="echarts.js"></script>
</head>
<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id="main" style="width: 600px;height:400px;"></div>
    <script type="text/javascript">
        var myChart = echarts.init(document.getElementById('main'));
		var option = {
			title: {
                text: '商品销量',
				left: 'center'
            },
			legend: {
				orient: 'vertical',
				left: 'left',
			},
			tooltip: {},
		    series : [{
                    name: '商品销量',
                    type: 'pie',    // 设置图表类型为饼图
                    radius: '55%',  // 饼图的半径，外半径为可视区尺寸（容器高宽中较小一项）的 55% 长度。
                    data:[          // 数据数组，name 为数据项名称，value 为数据项值
                        {value:235, name:'衬衫'},
                        {value:274, name:'羊毛衫'},
                        {value:310, name:'雪纺衫'},
                        {value:335, name:'裤子'},
                        {value:400, name:'高跟鞋'},
						{value:500, name:'袜子'}
                    ],
					roseType: 'angle',
                }
            ]
		}
        myChart.setOption(option);
    </script>
</body>
</html>
