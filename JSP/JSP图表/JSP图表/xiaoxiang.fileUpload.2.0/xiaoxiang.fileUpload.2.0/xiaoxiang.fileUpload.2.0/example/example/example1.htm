<div style="width:98%;padding:3em;"><font color="#F98300"><b>场景:</b></font><br>您需要用户只能上传"gif/jpg"图片,文件上传后按你的命名方式命名:"myname_number.ext",并且你不允许出现图片同名覆盖的现象.</div>


<form METHOD="POST" ACTION="example1_do.jsp" NAME="PW" ENCTYPE="multipart/form-data">
<table border="0" cellspacing="1" cellpadding="5" width="500" align=center bgcolor="#3A6EA5">
<th style="color:white" colspan=2>潇湘JSP上传组件示例(1)</th>
<tr bgcolor="#ffffff"><td bgcolor="#C4DFFB">文件一</td><td bgcolor="#E9F4FF"><input TYPE="file" name="FILE1"></td></tr>
<tr bgcolor="#ffffff"><td  bgcolor="#C4DFFB">文件二</td><td bgcolor="#E9F4FF"><input TYPE="file" name="FILE2"></td></tr>
<tr bgcolor="#ffffff"><td  bgcolor="#C4DFFB">文件名</td><td bgcolor="#E9F4FF"><input TYPE="text" name="fileName"></td></tr>
<tr bgcolor="#ffffff"><td  bgcolor="#C4DFFB">文件密码</td><td bgcolor="#E9F4FF"><input TYPE="password" name="pwd"></td></tr>
<tr bgcolor="#ffffff"><td  bgcolor="#C4DFFB">文件描述</td><td bgcolor="#E9F4FF"><TEXTAREA NAME="description" ROWS="5" COLS="19"></TEXTAREA></td></tr>
<tr bgcolor="#ffffff"><td  bgcolor="#C4DFFB">文件包括</td><td bgcolor="#E9F4FF"><INPUT TYPE="checkbox" NAME="fileContent" value="考试科目">考试科目<BR>
<INPUT TYPE="checkbox" NAME="fileContent" value="考生姓名">考生姓名<BR>
<INPUT TYPE="checkbox" NAME="fileContent"value="考试成绩">考试成绩</td></tr>
<tr bgcolor="#ffffff"><td  bgcolor="#C4DFFB">文件类型</td><td bgcolor="#E9F4FF"><INPUT TYPE="radio" NAME="fileType" value="dos">dos<BR>
<INPUT TYPE="radio" NAME="fileType" value="txt">txt<BR>
<INPUT TYPE="radio" NAME="fileType"value="wps">wps</td></tr>
<tr bgcolor="#ffffff"><td  bgcolor="#C4DFFB"></td><td bgcolor="#E9F4FF"><input TYPE="submit" value="确定上传"></td></tr>
</table>
</form>
