<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="common/include :: header('套餐审批')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-bpmnInfo-edit" th:object="${serviceItem}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label">服务单项名称：</label>
            <div class="col-sm-8">
                <input name="name" th:field="*{name}" class="form-control" type="text" readonly disabled="disabled">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">原价：</label>
            <div class="col-sm-8">
                <input  th:field="*{originalPrice}" class="form-control" type="text" readonly disabled="disabled">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">折扣价：</label>
            <div class="col-sm-8">
                <input id="discountPriceId" th:field="*{discountPrice}" class="form-control" type="text" readonly disabled="disabled">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">审核人(店长)：</label>
            <div class="col-sm-8">
                <select name="showOwnerId" class="form-control m-b" >
                    <option th:each="u : ${shopOwners}" th:text="${u.userName}" th:value="${u.id}"></option>
                </select>
            </div>
        </div>

        <div class="form-group" th:if="${serviceItem.discountPrice>3000}">
            <label class="col-sm-3 control-label">审核人(财务)：</label>
            <div class="col-sm-8">
                <select name="financeId" class="form-control m-b" >
                    <option th:each="u : ${finances}" th:text="${u.userName}" th:value="${u.id}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注信息：</label>
            <div class="col-sm-8">
                <textarea name="info" class="form-control"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="common/include :: footer" />
<script th:inline="javascript">
    var prefix = ctx + "/business/serviceItem";
    $("#form-bpmnInfo-edit").validate({
        focusCleanup: true
    });
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/startAudit", $('#form-bpmnInfo-edit').serialize());
        }
    }
</script>
</body>
</html>
